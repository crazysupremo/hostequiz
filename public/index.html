<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b120d">
<title>HosteQuiz</title>
<meta name="description" content="Quiz en directo de hostelería: cafés, bebidas, montaje de mesas y servicio. En español, português e English.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap"><div class="col" id="app"></div></div>
<script src="/common.js"></script>
<script>
const app = document.getElementById("app");
const params = new URLSearchParams(location.search);
let me = store.get("hq-player"); // { pin, id, name }
let es = null, timer = null;
let current = null;           // { fn, d } para redibujar al cambiar de idioma
let qState = {};              // { key, introEnd, end, choice }
let lastScore = 0;
onLangChange = () => current && current.fn(current.d, true);

const ICON_OK = '<svg class="icon" viewBox="0 0 84 84"><circle cx="42" cy="42" r="40" fill="rgba(0,0,0,.18)"/><path d="M24 43l12 12 24-26" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ICON_BAD = '<svg class="icon" viewBox="0 0 84 84"><circle cx="42" cy="42" r="40" fill="rgba(0,0,0,.18)"/><path d="M28 28l28 28M56 28L28 56" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/></svg>';
const ICON_GAME = '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 21h8M12 17v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const ICON_BOOK = '<svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z M4 5v16" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>';
const ICON_CUP2 = '<svg viewBox="0 0 24 24"><path d="M4 9h13v5a6 6 0 0 1-6 6H10a6 6 0 0 1-6-6z" fill="currentColor"/><path d="M17 10.5h1.5a2.5 2.5 0 0 1 0 5H17" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>';
const ICON_CAP = '<svg viewBox="0 0 24 24"><path d="M12 4 1.5 9 12 14l10.5-5z" fill="currentColor"/><path d="M6 11.5v4.2c0 1.5 2.7 3.3 6 3.3s6-1.8 6-3.3v-4.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M21 9v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
const ICON_SPARK = '<svg viewBox="0 0 24 24"><path d="M12 2l2.2 6.8L21 11l-6.8 2.2L12 20l-2.2-6.8L3 11l6.8-2.2z" fill="currentColor"/></svg>';

// ---------- pantalla de inicio ----------
// Formulario para entrar con PIN (igual en las dos secciones)
function joinForm(err, pin, keep, title = t("joinTitle"), desc = "") {
  const name = store.get("hq-name") || "";
  return `<form class="card" id="join" autocomplete="off">
        <h3>${title}</h3>${desc ? `<p class="muted small" style="margin:-4px 0 6px">${desc}</p>` : ""}
        <label class="label" for="pin">${t("pinLabel")}</label>
        <input class="pin" id="pin" inputmode="numeric" maxlength="6" placeholder="000000" value="${esc(keep.pin ?? pin)}">
        <label class="label" for="nm">${t("nameLabel")}</label>
        <input id="nm" maxlength="16" placeholder="${esc(t("namePh"))}" value="${esc(keep.nm ?? name)}" autocomplete="nickname">
        <p class="error" id="err">${esc(err ? t(err) : "")}</p>
        <button class="btn big" type="submit">${t("enter")}</button>
      </form>`;
}

let ESO_CATS = null;
async function homeEso(err = "", pinPrefill = "") {
  closeStream();
  current = { fn: (d) => homeEso(d.err, d.pin), d: { err, pin: pinPrefill } };
  const pin = pinPrefill || params.get("pin") || "";
  const keep = { pin: document.getElementById("pin")?.value, nm: document.getElementById("nm")?.value };
  if (!ESO_CATS) { try { ESO_CATS = await (await fetch("/api/categorias?curso=eso")).json(); } catch (e) { ESO_CATS = []; } }
  const total = ESO_CATS.reduce((s, c) => s + c.total, 0);
  const card = (c) => `<a class="subj" href="/practica.html?curso=eso&materia=${c.id}">
      <span class="badge" style="background:${SUBJ[c.id]?.c || "var(--c1)"}">${SUBJ[c.id]?.s || "?"}</span>
      <span><b>${esc(catName(c.id, c.nombre))}</b><small>${t("nQ", { n: c.total })}</small><span class="clock">⏱ ${t("perQ", { t: fmtTime(c.tiempo || 60) })}</span></span></a>`;
  const join = joinForm(err, pin, keep, t("esoClass"), t("esoClassDesc"));
  app.innerHTML = `<div class="screen">
    ${topbar(`<a class="backlink" href="/">☕ ${t("goHost")}</a>`)}
    ${pin ? join : ""}
    <div class="eso-head">
      <p class="label">${t("esoLabel")}</p>
      <h1>${t("esoH1")}</h1>
      <p class="lead">${t("esoIntro")}</p>
    </div>
    <h2 class="sec-title">${t("esoPractice")}</h2>
    <div class="subjects">
      ${ESO_CATS.map(card).join("")}
      <a class="subj all" href="/practica.html?curso=eso&materia=todas"><span class="badge">∑</span><span><b>${t("esoAll")}</b><small>${t("esoAllDesc")}</small><span class="clock">⏱ ${t("timeBySubject").split(" (")[0]}</span></span></a>
    </div>
    <div class="eso-row">
      ${pin ? "" : join}
      <div class="card">
        <h3>${t("esoTeacher")}</h3>
        <p class="muted">${t("esoTeacherDesc")}</p>
        <a class="btn" href="/host.html?curso=eso">${t("esoCreate")}</a>
      </div>
    </div>
    <p class="muted small">${t("esoNote")}</p>
    ${newsLink()}</div>`;
  wireJoin(pin, keep);
}

function home(err = "", pinPrefill = "") {
  if (CURSO === "eso") return homeEso(err, pinPrefill);
  closeStream();
  current = { fn: (d) => home(d.err, d.pin), d: { err, pin: pinPrefill } };
  const pin = pinPrefill || params.get("pin") || "";
  const keep = { pin: document.getElementById("pin")?.value, nm: document.getElementById("nm")?.value };
  app.innerHTML = `<div class="screen">
    ${topbar()}
    <div class="home-hero">
      <div class="stack" style="gap:18px">
        <div class="shapes">${SHAPES.map((s, i) => `<span style="color:var(--c${i})">${s}</span>`).join("")}</div>
        <h1>${t("tagline")}</h1>
        <p class="lead">${t("lead")}</p>
        <div class="modes">
          <a class="mode" href="/host.html"><span class="ico" style="background:var(--c1)">${ICON_GAME}</span>${t("createGame")}</a>
          <a class="mode" href="/practica.html"><span class="ico" style="background:var(--c3)">${ICON_BOOK}</span>${t("practice")}</a>
          <a class="mode" href="/crear.html"><span class="ico" style="background:var(--c2);color:#2a1a00">${ICON_SPARK}</span>${t("createAI")}</a>
        </div>
      </div>
      ${joinForm(err, pin, keep)}
    </div>
    <a class="gocard" href="/?curso=eso"><span class="badge">${ICON_CAP}</span><span><b>${t("goEso")}</b><small>${t("goEsoDesc")}</small></span><span class="arrow">›</span></a>
    <p class="foot">${t("foot")}</p>${newsLink()}</div>`;
  wireJoin(pin, keep);
}

function wireJoin(pin, keep) {
  const f = document.getElementById("join");
  if (!keep.pin && (pin || CURSO !== "eso")) (pin ? document.getElementById("nm") : document.getElementById("pin")).focus();
  f.addEventListener("submit", async (e) => {
    e.preventDefault();
    Sound.unlock();
    const btn = f.querySelector("button");
    btn.disabled = true;
    const pinV = document.getElementById("pin").value.replace(/\D/g, "");
    const nameV = document.getElementById("nm").value;
    try {
      const r = await api("/api/join", { pin: pinV, name: nameV });
      me = { pin: pinV, id: r.id, name: r.name };
      store.set("hq-player", me);
      store.set("hq-name", r.name);
      Sound.join(); buzz(30);
      connect();
    } catch (ex) {
      const el = document.getElementById("err");
      el.textContent = ex.message; el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake");
      btn.disabled = false;
    }
  });
}

// ---------- conexión del jugador ----------
function closeStream() { if (es) { es.close(); es = null; } clearInterval(timer); }

function connect() {
  closeStream();
  screen(`<div class="full"><h2 class="waitdots">${t("connecting")}</h2></div>`);
  es = stream({ pin: me.pin, role: "player", id: me.id }, {
    hello: (d) => { lastScore = d.score || 0; if (d.curso && d.curso !== CURSO) setCurso(d.curso); },
    lobby: () => show(showLobby, {}),
    question: (d) => show(showQuestion, d),
    result: (d) => show(showResult, d),
    wait: () => show(showWait, {}),
    podium: (d) => show(showPodium, d),
    finished: (d) => show(showFinished, d),
    kicked: () => leave("kicked"),
    gone: () => leave("gone", true),
    closed: () => leave("closed"),
  });
}
function show(fn, d) { current = { fn, d }; fn(d, false); }

function screen(html) {
  clearInterval(timer);
  document.querySelector(".intro")?.remove();
  app.innerHTML = `<div class="screen">${topbar(`<span class="pill">${esc(me?.name || "")}</span>`)}${html}</div>`;
}

function leave(msgKey, keepPin) {
  const pin = keepPin && me ? me.pin : "";
  store.del("hq-player");
  me = null;
  closeStream();
  home(msgKey || "", pin);
}

function showLobby() {
  screen(`<div class="full">
      <div class="shapes">${SHAPES.map((s, i) => `<span style="color:var(--c${i})">${s}</span>`).join("")}</div>
      <p class="label">${t("inGame")}</p>
      <h1>${esc(me.name)}</h1>
      <p class="muted">${t("findName")}</p>
      ${CURSO === "eso" ? "" : `<p class="muted small" style="margin-top:12px">${t("langHint")}</p>`}
    </div>`);
}
function showWait() { screen(`<div class="full"><h2>${t("lookScreen")}</h2><div class="bigscore">${lastScore}</div><p class="muted">${t("points")}</p></div>`); }

function sentScreen(choice, vf) {
  const ci = colorIdx(choice, vf);
  screen(`<div class="full"><div class="ans a${ci}" style="width:130px;height:130px;justify-content:center">${SHAPES[ci]}</div><h2>${t("sent")}</h2><p class="muted waitdots">${t("guess")}</p></div>`);
}

function showQuestion(d, redraw) {
  const key = me.pin + ":" + d.idx;
  if (qState.key !== key) qState = { key, introEnd: Date.now() + (d.intro || 0), end: Date.now() + (d.intro || 0) + d.left, choice: d.answered ? -1 : null };
  if (qState.choice !== null) return qState.choice >= 0 ? sentScreen(qState.choice, d.vf) : screen(`<div class="full"><h2>${t("sent")}</h2><p class="muted">${t("waitTime")}</p></div>`);
  const L = loc(d);
  const two = d.a.length === 2;
  const total = d.time * 1000;
  screen(`
    <div class="qhead"><span class="pill"><bdi dir="ltr">${d.idx + 1} / ${d.total}</bdi>${d.n ? " · " + lvTag(d.n) : ""}</span><span class="pill" id="left" dir="ltr">${fmtTime(Math.min(total, qState.end - Date.now()) / 1000)}</span></div>
    <div class="timebar"><i id="bar"></i></div>
    <p class="question" style="font-size:clamp(20px,5.6vw,30px);padding:2px 0">${esc(L.q)}</p>
    ${pic(d, "small")}
    <div class="pad ${two ? "two" : ""}" id="pad">
      ${L.a.map((txt, i) => `<button class="ans a${colorIdx(i, d.vf)}" data-i="${i}">${SHAPES[colorIdx(i, d.vf)]}<span class="tx">${esc(txt)}</span></button>`).join("")}
    </div>`);

  const pad = document.getElementById("pad");
  let introOn = Date.now() < qState.introEnd;
  if (introOn) {
    pad.classList.add("locked");
    document.body.insertAdjacentHTML("beforeend", `<div class="intro"><div class="inner"><p class="label">${t("question")} ${d.idx + 1} ${t("of")} ${d.total}</p><div class="num" id="introNum"></div><p class="iq">${esc(L.q)}</p></div></div>`);
  }
  let lastN = null;
  const upd = () => {
    const now = Date.now();
    if (introOn) {
      const n = Math.ceil((qState.introEnd - now) / 1000);
      if (n > 0 && n !== lastN) { lastN = n; const el = document.getElementById("introNum"); if (el) { el.textContent = n; el.style.animation = "none"; void el.offsetWidth; el.style.animation = ""; } if (!redraw) Sound.tick(); }
      if (now >= qState.introEnd) { introOn = false; document.querySelector(".intro")?.remove(); pad.classList.remove("locked"); if (!redraw) { Sound.go(); buzz(20); } }
    }
    const ms = Math.max(0, Math.min(total, qState.end - now));
    const l = document.getElementById("left"), b = document.getElementById("bar");
    if (l) l.textContent = fmtTime(ms / 1000);
    if (b) { b.style.transform = `scaleX(${ms / total})`; b.classList.toggle("low", ms <= 5000); }
    if (!ms && !introOn) clearInterval(timer);
  };
  upd();
  timer = setInterval(upd, 100);

  pad.querySelectorAll("[data-i]").forEach((b) =>
    b.addEventListener("click", async () => {
      if (introOn) return;
      const choice = +b.dataset.i;
      Sound.tap(); buzz(15);
      pad.querySelectorAll("[data-i]").forEach((x) => { x.disabled = true; x.classList.toggle("dim", x !== b); });
      try {
        await api("/api/answer", { pin: me.pin, id: me.id, choice });
        qState.choice = choice;
        sentScreen(choice, d.vf);
      } catch (ex) {
        screen(`<div class="full"><h2>${esc(ex.message)}</h2></div>`);
      }
    })
  );
}

function showResult(d, redraw) {
  const cls = !d.answered ? "none" : d.correct ? "ok" : "bad";
  const title = !d.answered ? t("noAnswer") : d.correct ? t("correct") : t("wrong");
  const okText = d.okTr?.[LANG] || d.okText;
  const prev = lastScore;
  lastScore = d.score ?? lastScore;
  screen(`
    <div class="full">
      <div class="result ${cls}">
        ${d.correct ? ICON_OK : d.answered ? ICON_BAD : ""}
        <div class="big">${title}</div>
        ${d.correct ? `<div class="pts">+${d.pts}</div>` : okText ? `<p>${t("rightWas")} <b>${esc(okText)}</b></p>` : ""}
        ${d.streak > 1 ? `<p>🔥 ${t("streak", { n: d.streak })}</p>` : ""}
      </div>
      <div class="bigscore" id="sc">${redraw ? lastScore : prev}</div>
      <p class="muted">${t("points")}${d.rank ? " · " + t("youAre", { r: d.rank, t: d.total }) : ""}</p>
      ${d.solo && d.idx < d.of ? `<p class="label" style="margin-top:6px">${t("nextComing")}</p>` : ""}
    </div>`);
  if (!redraw) {
    countUp(document.getElementById("sc"), lastScore);
    if (d.correct) { Sound.good(); buzz([40, 40, 80]); confetti(0.5); } else { Sound.bad(); buzz(200); }
  }
}

function showFinished(d, redraw) {
  lastScore = d.score;
  screen(`
    <div class="full">
      <p class="label">${t("hitsOf", { a: d.correct, b: d.of })}</p>
      <h1>${t("doneTitle")}</h1>
      <div class="bigscore">${d.score}</div><p class="muted">${t("points")}${d.rank ? " · " + t("youAre", { r: d.rank, t: d.total }) : ""}</p>
      <p class="muted" style="margin-top:10px">${t("waitOthers")}</p>
    </div>`);
  if (!redraw) { Sound.good(); confetti(0.6); }
}

function showPodium(d, redraw) {
  const msg = d.rank === 1 ? t("won") : d.rank <= 3 ? t("podiumYou") : t("wellPlayed");
  screen(`
    <div class="full">
      <p class="label">${t("gameOver")}</p>
      <h1>${msg}</h1>
      <h2>${t("place", { r: d.rank, t: d.total })}</h2>
      <div class="bigscore">${d.score}</div><p class="muted">${t("points")}</p>
      <ol class="board" style="width:100%;max-width:420px;margin-top:10px">${d.top.map((r) => `<li><span class="nm">${esc(r.name)}</span><span>${r.score}</span></li>`).join("")}</ol>
      <button class="btn" id="again">${t("backHome")}</button>
    </div>`);
  document.getElementById("again").addEventListener("click", () => leave(""));
  if (!redraw && d.rank <= 3) { Sound.fanfare(); confetti(d.rank === 1 ? 1.4 : 0.8); buzz([60, 60, 60, 60, 200]); }
}

// Si ya estaba en una partida (por ejemplo, el móvil se bloqueó), vuelve a ella
if (me && (!params.get("pin") || params.get("pin") === me.pin)) connect();
else home();
</script>
</body>
</html>
