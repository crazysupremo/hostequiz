<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b120d">
<title>HosteQuiz · Practicar</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Cairo:wght@400;700;800&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap"><div class="col" id="app" style="max-width:760px"></div></div>
<script src="/common.js"></script>
<script>
const app = document.getElementById("app");
const DATA_URL = window.HQ_DATA_URL || withCurso("/api/preguntas");
const VF_TXT = { es: ["Verdadero", "Falso"], pt: ["Verdadeiro", "Falso"], en: ["True", "False"], ar: ["صحيح", "خطأ"] };
let BANK = null, deck = [], pos = 0, hits = 0, misses = [], answeredNow = null, streak = 0;
let view = "pick";
const ESO = CURSO === "eso";
let clock = null, qEnd = 0; // reloj de examen (solo ESO)
const exitBtn = () => (ESO ? `<a class="backlink" href="/?curso=eso">← Volver</a>` : "");
const chosen = new Set();
const chosenLv = new Set(); // vacío = todos
const lvOk = (p) => !chosenLv.size || !p.n || chosenLv.has(p.n);
onLangChange = () => ({ pick, ask, done })[view]?.(true);

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
// La pregunta guarda el orden de las respuestas; el texto se saca en el idioma actual
function prep(p) {
  if (typeof p.vf === "boolean") return { p, vf: true, order: [0, 1], ok: p.vf ? 0 : 1 };
  const order = shuffle(p.a.map((_, i) => i));
  return { p, vf: false, order, ok: order.indexOf(0) };
}
function textOf(item) {
  const p = item.p;
  const tr = p.id && BANK.i18n?.[LANG]?.[p.id];
  const q = tr ? tr[0] : p.q;
  if (item.vf) return { q, a: VF_TXT[LANG] };
  const src = tr ? tr.slice(1) : p.a;
  return { q, a: item.order.map((i) => src[i] ?? p.a[i]) };
}
const catOf = (id) => (id.startsWith("mi-") ? BANK.categorias[id] : catName(id, BANK.categorias[id]));

async function start() {
  // La prueba de acceso tiene su propia página de práctica (modo estudio y evaluación)
  if (ESO) return location.replace("/estudiar.html?curso=eso&materia=" + (new URLSearchParams(location.search).get("materia") || "todas"));
  BANK = await (await fetch(DATA_URL)).json();
  // Mis quizzes (creados en este aparato) se añaden como temas extra
  if (ESO) {
    // En ESO se entra directamente desde la tarjeta de la materia
    const m = new URLSearchParams(location.search).get("materia");
    if (!m || (m !== "todas" && !BANK.categorias[m])) { location.replace("/?curso=eso"); return; }
    Object.keys(BANK.categorias).filter((c) => m === "todas" || c === m).forEach((c) => chosen.add(c));
    return run(shuffle(BANK.preguntas.filter((p) => chosen.has(p.c))).slice(0, m === "todas" ? 30 : 100));
  }
  for (const q of store.get("hq-quizzes") || []) {
    BANK.categorias["mi-" + q.id] = "★ " + q.title;
    BANK.preguntas.push(...q.preguntas.map((p) => ({ ...p, c: "mi-" + q.id })));
  }
  const only = new URLSearchParams(location.search).get("quiz");
  if (only && BANK.categorias["mi-" + only]) {
    chosen.add("mi-" + only);
    return run(shuffle(BANK.preguntas.filter((p) => p.c === "mi-" + only)));
  }
  Object.keys(BANK.categorias).filter((c) => !c.startsWith("mi-")).forEach((c) => chosen.add(c));
  pick();
}

function pick() {
  view = "pick";
  const count = (id) => BANK.preguntas.filter((p) => p.c === id && lvOk(p)).length;
  app.innerHTML = `<div class="screen">
    ${topbar()}
    <h1>${t("practiceTitle")}</h1>
    <p class="muted">${t("practiceLead")}</p>
    <div class="card">
      <h3>${t("whatReview")}</h3>
      <div class="chips">${Object.keys(BANK.categorias).map((id) => `<button class="chip" data-c="${id}" aria-pressed="${chosen.has(id)}">${esc(catOf(id))} <span class="n">${count(id)}</span></button>`).join("")}</div>
    </div>
    <div class="card">
      <h3>${t("level")}</h3>
      <div class="chips"><button class="chip" data-lv="0" aria-pressed="${!chosenLv.size}">${t("all")}</button>${[1, 2, 3].map((n) => `<button class="chip" data-lv="${n}" aria-pressed="${chosenLv.has(n)}"><span class="lvl lvl-${n}">●</span> ${t("lv" + n)}</button>`).join("")}</div>
    </div>
    <div class="row" style="justify-content:space-between">${CURSO === "eso" ? "<span></span>" : `<a class="btn ghost" href="/crear.html">${t("createMine")}</a>`}<button class="btn big" id="go" ${chosen.size ? "" : "disabled"}>${t("start")}</button></div>${newsLink()}</div>`;
  app.querySelectorAll("[data-c]").forEach((b) => b.addEventListener("click", () => {
    chosen.has(b.dataset.c) ? chosen.delete(b.dataset.c) : chosen.add(b.dataset.c);
    b.setAttribute("aria-pressed", chosen.has(b.dataset.c));
    document.getElementById("go").disabled = !chosen.size;
  }));
  app.querySelectorAll("[data-lv]").forEach((b) => b.addEventListener("click", () => {
    const n = +b.dataset.lv;
    if (!n) chosenLv.clear(); else chosenLv.has(n) ? chosenLv.delete(n) : chosenLv.add(n);
    if (chosenLv.size === 3) chosenLv.clear();
    pick();
  }));
  document.getElementById("go").addEventListener("click", () => {
    Sound.unlock();
    const list = BANK.preguntas.filter((p) => chosen.has(p.c) && lvOk(p));
    if (!list.length) { document.getElementById("go").textContent = t("noLevelQ"); return; }
    run(shuffle(list));
  });
}

function run(list) {
  deck = list.map(prep); pos = 0; hits = 0; misses = []; streak = 0;
  ask();
}

function ask(redraw) {
  view = "ask";
  if (pos >= deck.length) return done();
  const item = deck[pos];
  const L = textOf(item);
  app.innerHTML = `<div class="screen">
    ${topbar(exitBtn() + soundBtn())}
    <div class="qhead"><span class="pill" id="prog"></span><span class="pill">${esc(catOf(item.p.c))}${item.p.d && BANK.dominios ? " · " + esc(BANK.dominios[item.p.d]) : ""}${item.p.n ? " · " + lvTag(item.p.n) : ""}</span>${ESO ? `<span class="pill" id="clk" dir="ltr"></span>` : ""}</div>
    <div class="timebar"><i style="transform:scaleX(${(pos + (answeredNow !== null ? 1 : 0)) / deck.length})"></i></div>
    <p class="question" style="font-size:clamp(22px,5vw,36px)">${esc(L.q)}</p>
    ${pic(item.p)}
    <div class="answers">${L.a.map((txt, i) => { const ci = colorIdx(i, item.vf); return `<button class="ans a${ci}" data-i="${i}">${SHAPES[ci]}<span class="tx">${esc(txt)}</span></button>`; }).join("")}</div>
    <div id="fb" class="stack"></div></div>`;
  setProg();
  app.querySelectorAll("[data-i]").forEach((b) => b.addEventListener("click", () => answer(+b.dataset.i)));
  if (redraw && answeredNow !== null) return answer(answeredNow, true);
  if (ESO) {
    // Cada pregunta tiene el tiempo de su materia (Matemáticas 3 min)
    if (!redraw || !qEnd) qEnd = Date.now() + (BANK.tiempos?.[item.p.c] || 60) * 1000;
    clearInterval(clock);
    const draw = () => {
      const left = (qEnd - Date.now()) / 1000, el = document.getElementById("clk");
      if (el) { el.textContent = "⏱ " + fmtClock(left); el.style.color = left <= 10 ? "var(--bad)" : ""; }
      if (left <= 0) { clearInterval(clock); answer(-1); }
    };
    draw(); clock = setInterval(draw, 250);
  }
}

function answer(i, redraw) {
  const item = deck[pos];
  const right = i === item.ok;
  clearInterval(clock); qEnd = 0;
  if (!redraw) {
    answeredNow = i;
    if (right) { hits++; streak++; } else { misses.push(item.p); streak = 0; }
    if (right) { Sound.good(); buzz([30, 30, 60]); if (streak >= 3) confetti(0.4); } else { Sound.bad(); buzz(150); }
  }
  const L = textOf(item);
  setProg();
  app.querySelectorAll("[data-i]").forEach((b) => {
    const k = +b.dataset.i;
    b.disabled = true;
    b.classList.add(k === item.ok ? "right" : "dim");
    if (k === item.ok) b.insertAdjacentHTML("beforeend", '<span class="tick">✓</span>');
  });
  document.getElementById("fb").innerHTML = `
    <div class="result ${right ? "ok" : "bad"}" style="padding:16px">
      <div class="big" style="font-size:30px">${right ? t("correct") : i < 0 ? t("timeUp") : t("wrong")}</div>
      ${right ? (streak > 1 ? `<p>🔥 ${t("streak", { n: streak })}</p>` : "") : `<p>${t("rightIs")} <b>${esc(L.a[item.ok])}</b></p>`}
    </div>
    <div class="row end"><button class="btn big" id="nx">${pos + 1 < deck.length ? t("next") : t("seeResult")}</button></div>`;
  const nx = document.getElementById("nx");
  if (!redraw) nx.scrollIntoView({ behavior: "smooth", block: "nearest" });
  nx.addEventListener("click", () => { pos++; answeredNow = null; ask(); });
}

const setProg = () => { document.getElementById("prog").innerHTML = `<bdi dir="ltr">${pos + 1} / ${deck.length}</bdi> · ${hits} ${t("hits")}`; };

function done(redraw) {
  view = "done";
  const pct = Math.round((hits / deck.length) * 100);
  app.innerHTML = `<div class="screen">
    ${topbar(exitBtn())}
    <div class="full">
      <p class="label">${t("result")}</p>
      <div class="bigscore" style="font-size:clamp(60px,16vw,110px)" dir="ltr"><span id="pc">${redraw ? pct : 0}</span>%</div>
      <h2>${t("xOfY", { a: hits, b: deck.length })}</h2>
      <p class="muted">${pct >= 90 ? t("master") : pct >= 60 ? t("good") : t("review")}</p>
      <div class="row" style="justify-content:center">
        ${misses.length ? `<button class="btn" id="redo">${t("redo", { n: misses.length })}</button>` : ""}
        <button class="btn ghost" id="back">${t("otherTopics")}</button>
      </div>
    </div></div>`;
  if (!redraw) { countUp(document.getElementById("pc"), pct, 1000); if (pct >= 60) { Sound.fanfare(); confetti(pct >= 90 ? 1.3 : 0.7); } }
  document.getElementById("redo")?.addEventListener("click", () => run(shuffle(misses)));
  document.getElementById("back").addEventListener("click", () => (ESO ? location.assign("/?curso=eso") : pick()));
}

start().catch(() => { app.innerHTML = `${topbar()}<h2>${t("loadFail")}</h2><p class="muted">${t("reload")}</p>`; });
</script>
</body>
</html>
