<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b120d">
<title>HosteQuiz · Presentador</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap">
<link rel="stylesheet" href="/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
</head>
<body>
<div class="wrap"><div class="col" id="app"></div></div>
<script src="/common.js"></script>
<script>
const app = document.getElementById("app");
let game = store.get("hq-host", sessionStorage); // { pin, key }
let es = null, tick = null, players = [];
let cats = [];
let current = null; // { fn, d }
let qState = {};
const chosen = new Set();
const mine = store.get("hq-quizzes") || []; // quizzes creados en este aparato
const chosenMine = new Set();
const chosenLv = new Set(); // vacío = todos los niveles
const ESO = CURSO === "eso";
const opts = { n: null, t: ESO ? "auto" : 20, mode: "solo" };
const startQuiz = new URLSearchParams(location.search).get("quiz");
onLangChange = () => current && current.fn(current.d, true);

const act = (action, extra) => api("/api/host/action", { pin: game.pin, key: game.key, action, ...extra }).catch((e) => console.warn(e.message));
const header = (withEnd = true, back = false) => topbar(`${back && ESO ? `<a class="backlink" href="/?curso=eso">← Volver</a>` : ""}${soundBtn()}${withEnd ? `<button class="btn ghost small" id="end">${t("endGame")}</button>` : ""}`);
function wireEnd() {
  const b = document.getElementById("end");
  if (!b) return;
  b.addEventListener("click", () => {
    if (b.dataset.sure) { act("end"); finish(); setup(); }
    else { b.dataset.sure = "1"; b.textContent = t("sure"); setTimeout(() => { b.textContent = t("endGame"); delete b.dataset.sure; }, 3000); }
  });
}
function render(html) {
  clearInterval(tick);
  document.querySelector(".intro")?.remove();
  app.innerHTML = `<div class="screen">${html}</div>`;
  wireEnd();
}
function show(fn, d) { current = { fn, d }; fn(d, false); }
const ICON_PHONES = '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="2" y="5" width="8" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="14" y="3" width="8" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>';
const ICON_SCREEN = '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="2" y="4" width="20" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 21h8M12 17v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
const qLabel = (d) => `${t("question")} <bdi>${d.idx + 1}</bdi> ${t("of")} <bdi>${d.total}</bdi>${d.c || d.cat ? " · " + esc(catName(d.c, d.cat)) : ""}${d.n ? " · " + lvTag(d.n) : ""}`;

const autoHint = () => {
  const tm = (id) => fmtTime((cats.find((c) => c.id === id) || {}).tiempo || 60);
  return t("autoHint", { m: tm("matematicas"), c: tm("ciencias"), l: tm("lengua"), i: tm("ingles") });
};
// ---------- 1. Configurar ----------
async function setup(err = "") {
  if (!cats.length) {
    try { cats = await (await fetch(withCurso("/api/categorias"))).json(); } catch (e) { cats = []; }
    if (!ESO && startQuiz && mine.some((q) => q.id === startQuiz)) chosenMine.add(startQuiz);
    else cats.forEach((c) => chosen.add(c.id));
  }
  current = { fn: (d) => setup(d.err), d: { err } };
  if (opts.n === null) opts.n = chosenMine.size ? 100 : 10;
  render(`
    ${header(false, true)}
    <h1>${t("newGame")}</h1>
    <div class="card">
      <div class="row" style="justify-content:space-between"><h3>${ESO ? t("subjects") : t("topics")}</h3><button class="btn ghost small" id="all">${t("allNone")}</button></div>
      ${ESO ? `<p class="muted small" style="margin:-4px 0 10px">${t("subjectsHint")}</p><div class="subjects">${cats.map((c) => `<button type="button" class="subj" data-c="${c.id}" aria-pressed="${chosen.has(c.id)}"><span class="badge" style="background:${SUBJ[c.id]?.c}">${SUBJ[c.id]?.s}</span><span><b>${esc(catName(c.id, c.nombre))}</b><small>${t("nQ", { n: c.total })}</small><span class="clock">⏱ ${t("perQ", { t: fmtTime(c.tiempo || 60) })}</span></span></button>`).join("")}</div>`
      : `<div class="chips">${cats.map((c) => `<button class="chip" data-c="${c.id}" aria-pressed="${chosen.has(c.id)}">${esc(catName(c.id, c.nombre))} <span class="n">${c.total}</span></button>`).join("")}</div>`}
    </div>
    ${ESO ? "" : mine.length ? `<div class="card">
      <div class="row" style="justify-content:space-between"><h3>${t("myQuizzes")}</h3><a class="btn ghost small" href="/crear.html">${t("createOther")}</a></div>
      <div class="chips">${mine.map((q) => `<button class="chip" data-m="${q.id}" aria-pressed="${chosenMine.has(q.id)}">★ ${esc(q.title)} <span class="n">${q.preguntas.length}</span></button>`).join("")}</div>
    </div>` : `<p class="muted small">${t("wantOwn")} <a href="/crear.html" style="color:var(--caramel)">${t("wantOwnLink")}</a>.</p>`}
    <div class="card">
      <h3>${t("modeTitle")}</h3>
      <div class="modepick">
        ${[["solo", "modeSolo", "modeSoloDesc", ICON_PHONES], ["clasico", "modeSame", "modeSameDesc", ICON_SCREEN]].map(([v, a, b, ic]) => `
          <button type="button" class="modeopt" data-mode="${v}" aria-pressed="${opts.mode === v}">${ic}<span><b>${t(a)}</b><small>${t(b)}</small></span></button>`).join("")}
      </div>
    </div>
    <div class="card"><h3>${t("level")}</h3><div class="chips" id="lv"></div></div>
    <div class="row" style="align-items:stretch">
      <div class="card" style="flex:1;min-width:220px">
        <label class="label" for="n">${opts.mode === "solo" ? t("perPlayer", { n: "" }).trim() : t("nQuestions")}</label>
        <div class="numpick">
          <button type="button" class="langbtn" data-step="-5" aria-label="-5">−</button>
          <input id="n" type="number" inputmode="numeric" min="1" max="100" value="${opts.n}">
          <button type="button" class="langbtn" data-step="5" aria-label="+5">+</button>
        </div>
        <div class="chips">${[10, 20, 30, 50].map((n) => `<button type="button" class="chip" data-n="${n}" aria-pressed="${opts.n === n}">${n}</button>`).join("")}</div>
      </div>
      <div class="card" style="flex:1;min-width:220px">
        <label class="label" for="t">${t("timePerQ")}</label>
        <select id="t">${ESO ? `<option value="auto" ${opts.t === "auto" ? "selected" : ""}>${t("timeBySubject")}</option>` : ""}${(ESO ? [60, 120, 180, 300] : [10, 20, 30, 60]).map((n) => `<option value="${n}" ${n === opts.t ? "selected" : ""}>${fmtTime(n)}</option>`).join("")}</select>
      </div>
    </div>
    <p class="muted small" id="avail"></p>
    <p class="error">${esc(err ? t(err) : "")}</p>
    <div class="row end"><button class="btn big" id="go">${t("createBtn")}</button></div>
    ${newsLink()}`);
  app.querySelectorAll("[data-mode]").forEach((b) => b.addEventListener("click", () => { opts.mode = b.dataset.mode; setup(err); }));

  // Número de preguntas: se puede escribir cualquier número del 1 al 100
  const nInput = document.getElementById("n");
  const setN = (v) => {
    opts.n = Math.min(100, Math.max(1, Math.round(+v) || 1));
    nInput.value = opts.n;
    app.querySelectorAll("[data-n]").forEach((c) => c.setAttribute("aria-pressed", +c.dataset.n === opts.n));
  };
  nInput.addEventListener("input", () => { if (nInput.value !== "") opts.n = Math.min(100, Math.max(1, +nInput.value || 1)); app.querySelectorAll("[data-n]").forEach((c) => c.setAttribute("aria-pressed", +c.dataset.n === +nInput.value)); });
  nInput.addEventListener("change", () => setN(nInput.value));
  app.querySelectorAll("[data-step]").forEach((b) => b.addEventListener("click", () => setN(opts.n + +b.dataset.step)));
  app.querySelectorAll("[data-n]").forEach((b) => b.addEventListener("click", () => setN(+b.dataset.n)));
  document.getElementById("t").addEventListener("change", (e) => { opts.t = e.target.value === "auto" ? "auto" : +e.target.value; });
  const drawLv = () => {
    document.getElementById("lv").innerHTML =
      `<button class="chip" data-lv="0" aria-pressed="${!chosenLv.size}">${t("all")}</button>` +
      [1, 2, 3].map((n) => `<button class="chip" data-lv="${n}" aria-pressed="${chosenLv.has(n)}"><span class="lvl lvl-${n}">●</span> ${t("lv" + n)}</button>`).join("");
    app.querySelectorAll("[data-lv]").forEach((b) => b.addEventListener("click", () => {
      const n = +b.dataset.lv;
      if (!n) chosenLv.clear(); else chosenLv.has(n) ? chosenLv.delete(n) : chosenLv.add(n);
      if (chosenLv.size === 3) chosenLv.clear();
      drawLv(); upd();
    }));
  };
  const lvOk = (n) => !chosenLv.size || !n || chosenLv.has(n);
  const upd = () => {
    const total = cats.filter((c) => chosen.has(c.id)).reduce((s, c) => s + (chosenLv.size ? [1, 2, 3].filter((n) => chosenLv.has(n)).reduce((x, n) => x + c.porNivel[n - 1], 0) : c.total), 0)
      + mine.filter((q) => chosenMine.has(q.id)).reduce((s, q) => s + q.preguntas.filter((p) => lvOk(p.n)).length, 0);
    document.getElementById("avail").textContent = total ? t("available", { n: total }) : t("chooseOne");
    document.getElementById("go").disabled = !total;
  };
  drawLv();
  app.querySelectorAll("[data-c]").forEach((b) => b.addEventListener("click", () => {
    const id = b.dataset.c;
    chosen.has(id) ? chosen.delete(id) : chosen.add(id);
    b.setAttribute("aria-pressed", chosen.has(id));
    upd();
  }));
  app.querySelectorAll("[data-m]").forEach((b) => b.addEventListener("click", () => {
    const id = b.dataset.m;
    chosenMine.has(id) ? chosenMine.delete(id) : chosenMine.add(id);
    b.setAttribute("aria-pressed", chosenMine.has(id));
    upd();
  }));
  document.getElementById("all").addEventListener("click", () => {
    const allOn = chosen.size === cats.length;
    cats.forEach((c) => (allOn ? chosen.delete(c.id) : chosen.add(c.id)));
    app.querySelectorAll("[data-c]").forEach((b) => b.setAttribute("aria-pressed", chosen.has(b.dataset.c)));
    upd();
  });
  document.getElementById("go").addEventListener("click", async (e) => {
    e.currentTarget.disabled = true;
    Sound.unlock();
    try {
      const r = await api("/api/host/create", { cats: [...chosen], custom: mine.filter((q) => chosenMine.has(q.id)), niveles: [...chosenLv], n: opts.n, time: opts.t, mode: opts.mode, curso: CURSO });
      game = { pin: r.pin, key: r.hostKey, mode: r.mode };
      store.set("hq-host", game, sessionStorage);
      connect();
    } catch (ex) { setup(ex.message); }
  });
  upd();
}

// ---------- 2. Conexión ----------
function connect() {
  if (es) es.close();
  render(`${header()}<div class="full"><h2 class="waitdots">${t("connecting")}</h2></div>`);
  es = stream({ pin: game.pin, role: "host", key: game.key }, {
    hello: (d) => { game.total = d.total; game.mode = d.mode; if (d.state === "lobby") show(lobby, {}); },
    race: (d) => { if (current?.fn === showRace) { current.d = d; drawRace(d); } else show(showRace, d); },
    players: (list) => {
      if (list.length > players.length && current?.fn === lobby) Sound.join();
      players = list;
      if (document.getElementById("plist")) drawPlayers();
    },
    question: (d) => show(showQuestion, d),
    answered: (d) => {
      const el = document.getElementById("ansc");
      if (el) { el.textContent = `${d.answered} / ${d.players} ${t("answers")}`; el.animate?.([{ transform: "scale(1.15)" }, { transform: "none" }], 250); }
      if (current?.d) current.d.answered = d.answered;
    },
    reveal: (d) => show(showReveal, d),
    board: (d) => show(showBoard, d),
    podium: (d) => show(showPodium, d),
    closed: () => { finish(); setup("closed"); },
  });
}
function finish() { if (es) es.close(); es = null; store.del("hq-host", sessionStorage); game = null; players = []; }

// ---------- 3. Sala de espera ----------
function lobby() {
  const url = `${location.origin}/?pin=${game.pin}`;
  let qr = "";
  try { const q = qrcode(0, "M"); q.addData(url); q.make(); qr = q.createSvgTag({ margin: 0, scalable: true }); } catch (e) {}
  render(`
    ${header()}
    <div class="card lobby">
      <div class="stack">
        <p class="label">${t("joinAt")} <b style="color:var(--crema);letter-spacing:0;text-transform:none;font-size:18px" dir="ltr">${esc(location.host)}</b> ${t("withPin")}</p>
        <div class="pinbox"><div class="pin">${game.pin.replace(/(\d{3})(\d{3})/, "$1 $2")}</div></div>
        <p class="muted">${game.mode === "solo" ? t("perPlayer", { n: game.total }) : t("qCount", { n: game.total })} · ${t("scanQR")}</p>
        ${game.mode === "solo" ? `<p class="muted small">${ICON_PHONES} ${t("modeSoloDesc")}</p>` : ""}
        <p class="muted small">${GLOBE} ${t("langHint")}</p>
      </div>
      ${qr ? `<div class="qr">${qr}</div>` : ""}
    </div>
    <div class="row" style="justify-content:space-between"><h2 id="pcount">${t("players")}</h2><button class="btn big" id="start" disabled>${t("start")}</button></div>
    <div class="players" id="plist"></div>
    ${newsLink()}`);
  document.getElementById("start").addEventListener("click", () => { Sound.unlock(); act("start"); });
  drawPlayers();
}
function drawPlayers() {
  const el = document.getElementById("plist");
  document.getElementById("pcount").textContent = `${players.length} ${players.length === 1 ? t("player1") : t("playersN")}`;
  document.getElementById("start").disabled = !players.length;
  el.innerHTML = players.length
    ? players.map((p) => `<span class="player ${p.online ? "" : "off"}">${esc(p.name)}<button title="${esc(t("kick", { n: p.name }))}" aria-label="${esc(t("kick", { n: p.name }))}" data-k="${p.id}">✕</button></span>`).join("")
    : `<p class="muted waitdots">${t("waitingFirst")}</p>`;
  el.querySelectorAll("[data-k]").forEach((b) => b.addEventListener("click", () => act("kick", { id: b.dataset.k })));
}

// ---------- Carrera en directo (modo individual) ----------
function showRace(d, redraw) {
  render(`
    ${header()}
    <div class="row" style="justify-content:space-between"><h1>${t("race")}</h1><span class="pill">${t("perPlayer", { n: d.total })}</span></div>
    <ol class="race" id="race"></ol>
    <div class="row end"><button class="btn big" id="finish">${t("finishBtn")}</button></div>`);
  document.getElementById("finish").addEventListener("click", () => act("finish"));
  drawRace(d);
}
let lastRaceRanks = {};
function drawRace(d) {
  const el = document.getElementById("race");
  if (!el) return;
  const max = Math.max(1, ...d.list.map((r) => r.score));
  el.innerHTML = d.list.map((r) => {
    const mv = (lastRaceRanks[r.id] || r.rank) - r.rank;
    return `<li class="${r.done ? "done" : ""} ${r.online ? "" : "off"}">
      <span class="pos">${r.rank}</span>
      <span class="who"><b>${esc(r.name)}</b><span class="prog"><i style="width:${(r.i / Math.max(1, r.total)) * 100}%"></i></span><small>${r.done ? "✓ " + t("finished") : `${r.i} / ${r.total}`} · ${t("hitsOf", { a: r.correct, b: r.i })}</small></span>
      ${mv > 0 ? '<span class="mv up">▲</span>' : mv < 0 ? '<span class="mv down">▼</span>' : '<span class="mv"></span>'}
      <span class="sc">${r.score}</span>
      <span class="bar" style="width:${(r.score / max) * 100}%"></span>
    </li>`;
  }).join("") || `<p class="muted">${t("nobody")}</p>`;
  lastRaceRanks = Object.fromEntries(d.list.map((r) => [r.id, r.rank]));
}

// ---------- 4. Pregunta ----------
function tiles(d, L, counts, ok) {
  return `<div class="answers">${L.a.map((txt, i) => {
    const ci = colorIdx(i, d.vf);
    const cls = ok === undefined ? "" : i === ok ? "right" : "dim";
    return `<div class="ans a${ci} ${cls}">${SHAPES[ci]}<span class="tx">${esc(txt)}</span>${counts ? `<span class="cnt">${counts[i]}</span>` : ""}${ok === i ? '<span class="tick">✓</span>' : ""}</div>`;
  }).join("")}</div>`;
}
function showQuestion(d, redraw) {
  const key = game.pin + ":" + d.idx;
  if (qState.key !== key) qState = { key, introEnd: Date.now() + (d.intro || 0), end: Date.now() + (d.intro || 0) + d.left };
  const L = loc(d);
  const total = d.time * 1000;
  render(`
    ${header()}
    <div class="qhead">
      <span class="pill">${qLabel(d)}</span>
      <span class="pill" id="ansc">${d.answered || 0} / ${d.players} ${t("answers")}</span>
    </div>
    <div class="qrow">
      ${ring("tm", d.time)}
      <p class="question" style="flex:1">${esc(L.q)}</p>
    </div>
    ${pic(d)}
    ${tiles(d, L)}
    <div class="row end"><button class="btn ghost" id="skip">${t("showNow")}</button></div>`);
  document.getElementById("skip").addEventListener("click", () => act("skip"));

  let introOn = Date.now() < qState.introEnd;
  if (introOn) document.body.insertAdjacentHTML("beforeend", `<div class="intro"><div class="inner"><p class="label">${qLabel(d)}</p><div class="num" id="introNum"></div><p class="iq">${esc(L.q)}</p></div></div>`);
  let lastN = null, lastS = null;
  const upd = () => {
    const now = Date.now();
    if (introOn) {
      const n = Math.ceil((qState.introEnd - now) / 1000);
      if (n > 0 && n !== lastN) { lastN = n; const el = document.getElementById("introNum"); if (el) { el.textContent = n; el.style.animation = "none"; void el.offsetWidth; el.style.animation = ""; } if (!redraw) Sound.tick(); }
      if (now >= qState.introEnd) { introOn = false; document.querySelector(".intro")?.remove(); if (!redraw) Sound.go(); }
    }
    const ms = Math.max(0, Math.min(total, qState.end - now));
    setRing("tm", ms, total);
    const s = Math.ceil(ms / 1000);
    if (!introOn && s !== lastS) { if (s <= 5 && s > 0 && lastS !== null) Sound.tick(); lastS = s; }
    if (!ms && !introOn) clearInterval(tick);
  };
  upd();
  tick = setInterval(upd, 100);
}

// ---------- 5. Respuesta correcta ----------
function showReveal(d, redraw) {
  const L = loc(d);
  const max = Math.max(1, ...d.counts);
  render(`
    ${header()}
    <div class="qhead"><span class="pill">${qLabel(d)}</span><span class="pill">${d.answeredCount} / ${d.players} ${t("answered")}</span></div>
    <p class="question">${esc(L.q)}</p>
    <div class="bars">${d.counts.map((c, i) => {
      const ci = colorIdx(i, d.vf);
      return `<div class="bar ${i === d.ok ? "" : "dim"}"><b>${c}</b><i style="height:${Math.max(4, (c / max) * 120)}px;background:var(--c${ci})"></i><span style="color:var(--c${ci})">${SHAPES[ci]}</span></div>`;
    }).join("")}</div>
    ${tiles(d, L, d.counts, d.ok)}
    <div class="row end"><button class="btn big" id="next">${t("leaderboard")}</button></div>`);
  document.getElementById("next").addEventListener("click", () => act("next"));
  if (!redraw) Sound.good();
}

// ---------- 6. Clasificación ----------
function showBoard(d, redraw) {
  const last = d.idx + 1 >= d.total;
  const max = Math.max(1, ...d.top.map((r) => r.score));
  render(`
    ${header()}
    <h1 style="text-align:center">${t("leaderboard")}</h1>
    <ol class="board" style="max-width:680px;width:100%;margin:0 auto">${d.top.map((r) => {
      const mv = r.prev - r.rank;
      return `<li><span class="fill" style="width:${(r.score / max) * 100}%"></span><span class="mv ${mv > 0 ? "up" : mv < 0 ? "down" : ""}">${mv > 0 ? "▲" + mv : mv < 0 ? "▼" + -mv : ""}</span><span class="nm">${esc(r.name)}</span>${r.gained ? `<span class="gain">+${r.gained}</span>` : ""}<span class="sc" data-v="${r.score}">${redraw ? r.score : 0}</span></li>`;
    }).join("") || `<p class='muted'>${t("nobody")}</p>`}</ol>
    <div class="row end"><button class="btn big" id="next">${last ? t("seePodium") : t("nextQ")}</button></div>`);
  document.getElementById("next").addEventListener("click", () => act("next"));
  if (!redraw) app.querySelectorAll(".sc").forEach((el) => countUp(el, +el.dataset.v, 1100));
}

// ---------- 7. Podio ----------
const CROWN = '<svg class="crown" viewBox="0 0 40 30"><path d="M3 26 6 8l9 9 5-13 5 13 9-9 3 18z" fill="currentColor"/></svg>';
function showPodium(d, redraw) {
  const [a, b, c] = d.top;
  const step = (r, n) => r ? `<div class="step p${n}">${n === 1 ? CROWN : ""}<div class="nm">${esc(r.name)}</div><div class="pts">${r.score} ${t("pts")}</div><div class="blk">${n}</div></div>` : `<div></div>`;
  render(`
    ${header(false)}
    <h1 style="text-align:center">${t("congrats")}</h1>
    <div class="podium">${step(b, 2)}${step(a, 1)}${step(c, 3)}</div>
    ${d.top.length > 3 ? `<ol class="board" style="max-width:640px;width:100%;margin:0 auto;counter-reset:pos 3">${d.top.slice(3).map((r) => `<li><span class="nm">${esc(r.name)}</span><span>${r.score}</span></li>`).join("")}</ol>` : ""}
    <div class="row" style="justify-content:center"><button class="btn big" id="new">${t("newGame")}</button></div>`);
  document.getElementById("new").addEventListener("click", () => { act("end"); finish(); setup(); });
  if (!redraw) { setTimeout(() => { Sound.fanfare(); confetti(1.6); }, 1800); }
}

if (game) connect(); else setup();
</script>
